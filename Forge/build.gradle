plugins {
    id 'java'
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = "${minecraft_version}-${build_number}-NEOFORGE"
if (System.getenv().RELEASE_MODE != "1") {
    version += '-SNAPSHOT'
}

neoForge {
    version = "${neoforge_version}"

    accessTransformers = [project(':Xplat').file('src/main/resources/META-INF/accesstransformer.cfg')]

    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }

    runs {
        client {
            client()
            systemProperty('neoforge.logging.console.level', 'debug')
        }

        server {
            server()
            systemProperty('neoforge.logging.console.level', 'debug')
        }

        data {
            data()
            programArguments.addAll '--mod', 'botania', '--all'
            programArguments.addAll '--output', file('src/generated/resources/').getAbsolutePath()
            programArguments.addAll '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            gameDirectory = file('../run/')
            systemProperty('fml.earlyprogresswindow', 'false')
        }
    }

    mods {
        botania {
            sourceSet sourceSets.main
            sourceSet project(":Xplat").sourceSets.main
        }
    }
}

repositories {
    maven {
        name = "Jared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "C4"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/" // for emi
    }
    maven {
        name = "Unascribed"
        url "https://repo.unascribed.com" // for ears
        content {
            includeGroup "com.unascribed"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven" // for Embeddium (replaces Rubidium on NeoForge)
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    compileOnly project(":Xplat")

    // Mixin annotation processor — generates botania.refmap.json at compile time.
    // NeoForge ships Mixin at runtime; we only need the AP here.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // In NeoForge moddev (non-legacyForge) there is no modImplementation/modCompileOnly.
    // Use compileOnly for APIs and localRuntime for mods needed in dev-run environment.

    // Patchouli — required dep; compile + runtime in dev
    compileOnly("vazkii.patchouli:Patchouli:${minecraft_version}-93-NEOFORGE")
    runtimeOnly("vazkii.patchouli:Patchouli:${minecraft_version}-93-NEOFORGE")

    // JEI — compile against common API; full mod available at dev runtime
    compileOnly("mezz.jei:jei-1.21.1-common-api:19.27.0.340")
    runtimeOnly("mezz.jei:jei-1.21.1-neoforge:19.27.0.340")

    // EMI — compile against API only
    compileOnly("dev.emi:emi-neoforge:1.1.24+${minecraft_version}:api")
    //runtimeOnly("dev.emi:emi-neoforge:1.1.24+${minecraft_version}")

    // Curios — required dep; compile API + dev runtime
    compileOnly("top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1:api")
    runtimeOnly("top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1")

    compileOnly('com.unascribed:ears-api:1.4.5')

    // Rubidium is Forge-only; Embeddium is its NeoForge successor
    compileOnly('maven.modrinth:embeddium:1.0.15+mc1.21.1') { transitive = false }

    compileOnly "org.jetbrains:annotations:24.0.1"
}

compileJava {
    source(project(":Xplat").sourceSets.main.allSource)
    options.compilerArgs << "-Xlint:all,-classfile,-processing,-deprecation,-serial" << "-Werror"
    // Tell the Mixin AP where to write the refmap
    options.compilerArgs << "-Amixin.refmapName=botania.refmap.json"
}

sourcesJar {
    from project(":Xplat").sourceSets.main.allJava
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude 'assets/botania/patchouli_books/lexicon/en_us/README'
}

processResources {
    from project(":Xplat").sourceSets.main.resources
    inputs.property "version", project.version

    filesMatching("neoforge.mods.toml") {
        expand "version": project.version
    }

    from '../contributors.properties'
    // Exclude datagenerator .cache directory
    exclude '.cache'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "${mod_name}",
                "Specification-Vendor"    : "vazkii",
                "Specification-Version"   : "1",
                "Implementation-Title"    : "${mod_name}",
                "Implementation-Version"  : "${archiveVersion.get()}",
                "Implementation-Vendor"   : "vazkii",
                "MixinConfigs"            : "botania_xplat.mixins.json,botania_forge.mixins.json"
        ])
    }
    // No reobfJar needed — NeoForge does not use obfuscation
}

task apiJar(type: Jar, dependsOn: classes) {
    // Sources included because of MinecraftForge/ForgeGradle#369
    from project(":Xplat").sourceSets.main.allJava
    from(sourceSets.main.allJava)
    from(sourceSets.main.output)

    include 'vazkii/botania/api/**'

    archiveClassifier = 'api'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            artifact jar
            artifact sourcesJar
            artifact apiJar
            pom.withXml {
                def node = asNode()
                if (node.dependencies.size() > 0)
                    node.remove(node.dependencies) // Remove deps, as they are all mappings-dependent
            }
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}
